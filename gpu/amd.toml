# gpu/amd — AMD open-source GPU stack
#
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "gpu/amd"
name        = "amd"
version     = "0.1.0"
description = "AMD GPU — amdgpu, mesa, Vulkan, VA-API, 32-bit"
category    = "gpu"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[packages]
nix = [
  "pciutils",
  "lm_sensors",
  "corectrl",
]

[linux.gpu]
driver  = "amdgpu"
vulkan  = true
opencl  = true
vaapi   = true
32bit   = true

[fragment.safety]
mutates_system_services = false
mutates_hardware_drivers = true
requires_confirmation = true
