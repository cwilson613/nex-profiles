# desktop/gnome — GNOME desktop environment
#
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "desktop/gnome"
name        = "gnome"
version     = "0.1.0"
description = "GNOME desktop — dark mode, dash favorites, extensions"
category    = "desktop"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[linux]
desktop = "gnome"

[packages]
nix = [
  "gnome-tweaks",
]

[linux.gnome]
dark_mode      = true
dash_favorites = [
  "org.gnome.Nautilus.desktop",
  "kitty.desktop",
  "firefox.desktop",
  "org.gnome.Settings.desktop",
]
hot_corners = false

[fragment.safety]
mutates_system_services = true
mutates_hardware_drivers = false
requires_confirmation = true
