# desktop/kde — KDE Plasma desktop environment
#
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "desktop/kde"
name        = "kde"
version     = "0.1.0"
description = "KDE Plasma desktop — dark theme, panel, defaults"
category    = "desktop"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[linux]
desktop = "kde"

[linux.kde]
dark_mode    = true
panel_height = 44
favorites = [
  "org.kde.dolphin.desktop",
  "kitty.desktop",
  "firefox.desktop",
  "systemsettings.desktop",
]

[fragment.safety]
mutates_system_services = true
mutates_hardware_drivers = false
requires_confirmation = true
