# desktop/hyprland — Hyprland tiling compositor
#
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "desktop/hyprland"
name        = "hyprland"
version     = "0.1.0"
description = "Hyprland tiling Wayland compositor — waybar, wofi, sane keybinds"
category    = "desktop"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[linux]
desktop = "hyprland"

[packages]
nix = [
  "hyprland",
  "waybar",
  "wofi",
  "swaylock",
  "swayidle",
  "grim",
  "slurp",
  "wl-clipboard",
  "mako",
]

[fragment.safety]
mutates_system_services = true
mutates_hardware_drivers = false
requires_confirmation = true
