# desktop/cosmic — System76 COSMIC desktop environment
#
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "desktop/cosmic"
name        = "cosmic"
version     = "0.1.0"
description = "COSMIC desktop — dark mode, dock, app defaults"
category    = "desktop"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[linux]
desktop = "cosmic"

[linux.cosmic]
dark_mode      = true
dock_autohide  = false
dock_favorites = [
  "com.system76.CosmicFiles",
  "kitty",
  "firefox",
  "com.system76.CosmicSettings",
]

[fragment.safety]
mutates_system_services = true
mutates_hardware_drivers = false
requires_confirmation = true
