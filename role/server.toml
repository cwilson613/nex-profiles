# role/server — headless Linux server
#
# Monitoring, hardened SSH, containers, no GUI.
# Requires: platform/linux

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "role/server"
name        = "server"
version     = "0.1.0"
description = "Headless server — monitoring, hardened SSH, containers, no GUI"
category    = "role"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"

[packages]
nix = [
  "docker",
  "docker-compose",
  "tmux",
  "lsof",
  "iotop",
  "ncdu",
  "fail2ban",
]

[linux.ssh]
permit_root_login       = false
password_authentication = false
challenge_response      = false

[linux.services]
docker  = true
sshd    = true
fail2ban = true
