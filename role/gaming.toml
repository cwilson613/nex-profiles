# role/gaming — Linux gaming stack
#
# Steam, Proton, performance overlays, controller support.
# Requires: platform/linux (gaming on macOS is a different kind of pain)

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "role/gaming"
name        = "gaming"
version     = "0.1.0"
description = "Linux gaming — Steam, Proton-GE, MangoHud, Gamemode, Gamescope"
category    = "role"
requires    = ["platform/linux"]
platforms   = ["linux"]
visibility  = "public"
[packages]
nix = [
  "discord",
  "obs-studio",
]

[linux.gaming]
steam       = true
gamemode    = true
mangohud    = true
gamescope   = true
controllers = true
proton_ge   = true
